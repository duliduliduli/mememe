name: Tests

on:
  push:
    branches: [main]
    paths: ["grad-backtest/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["grad-backtest/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grad-backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: grad-backtest/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest -v
